[project]
name = "agentops-api"
version = "0.1.0"
description = "AgentOps Commander backend API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary,pool]>=3",
    "alembic>=1.20.0",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory must not shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]

[tool.mypy]
strict = true
files = ["app", "tests", "alembic", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
